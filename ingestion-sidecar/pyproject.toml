[project]
name = "ingestion-sidecar"
version = "0.1.0"
description = "Reading Clipper ingestion sidecar — URL/PDF extraction, chunking, embedding"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.27",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
docling = [
    "docling>=2.50",
]
contentcore = [
    "content-core>=0.1",
]
esperanto = [
    "esperanto>=0.1",
]
all = [
    "ingestion-sidecar[docling,contentcore,esperanto]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"
