<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Sources - Reading Clipper</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* 页面特定样式 */
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .source-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .source-table th,
        .source-table td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .source-table th {
            background: var(--bg-secondary);
            font-weight: 600;
            color: var(--text-secondary);
        }

        .source-table tr:hover {
            background: var(--bg-secondary);
        }

        .action-btn {
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: transparent;
            cursor: pointer;
            margin-right: 8px;
            font-size: 13px;
        }

        .action-btn:hover {
            background: var(--primary-color-alpha);
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .action-btn.delete:hover {
            background: #fee2e2;
            color: #ef4444;
            border-color: #ef4444;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            padding: 24px;
            border-radius: var(--radius-lg);
            width: 500px;
            max-width: 90%;
            box-shadow: var(--shadow-lg);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-input);
            color: var(--text-primary);
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        .importance-badge {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .imp-1 {
            background-color: #ef4444;
        }

        .imp-2 {
            background-color: #f97316;
        }

        .imp-3 {
            background-color: #94a3b8;
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <div class="header-actions">
            <div>
                <h1 style="margin-bottom: 8px;">Managed Sources</h1>
                <a href="/" style="color: var(--text-secondary); text-decoration: none;">&larr; Back to Cards</a>
            </div>
            <button class="primary-btn" onclick="openModal()">+ Add New Source</button>
        </div>

        <!-- Source List -->
        <table class="source-table">
            <thead>
                <tr>
                    <th>Info Source</th>
                    <th>Category</th>
                    <th>Importance</th>
                    <th>Region</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="sourceListBody">
                <!-- Rendered via JS -->
            </tbody>
        </table>
    </div>

    <!-- Edit/Add Modal -->
    <div class="modal-overlay" id="sourceModal">
        <div class="modal-content">
            <h2 id="modalTitle" style="margin-bottom: 20px;">Add Source</h2>
            <form id="sourceForm">
                <input type="hidden" id="sourceId">

                <div class="form-group">
                    <label>Source Name</label>
                    <input type="text" id="name" required placeholder="e.g. OpenAI Blog">
                </div>

                <div class="form-group">
                    <label>Website URL</label>
                    <input type="url" id="url" required placeholder="https://...">
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select id="category">
                        <option value="官方一手">官方一手</option>
                        <option value="科技媒体">科技媒体</option>
                        <option value="独立研究机构">独立研究机构</option>
                        <option value="投资机构报告">投资机构报告</option>
                        <option value="技术博客">技术博客</option>
                        <option value="社交/社区/视频">社交/社区/视频</option>
                        <option value="其他">其他</option>
                    </select>
                </div>

                <div class="form-group" style="display: flex; gap: 16px;">
                    <div style="flex: 1;">
                        <label>Importance (1=High)</label>
                        <select id="importance_level">
                            <option value="1">🔴 Level 1 (High)</option>
                            <option value="2">🟠 Level 2 (Medium)</option>
                            <option value="3">⚪ Level 3 (Low)</option>
                        </select>
                    </div>
                    <div style="flex: 1;">
                        <label>Region</label>
                        <select id="region">
                            <option value="overseas">🌍 Overseas</option>
                            <option value="domestic">🇨🇳 Domestic</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Description (Helps AI Matching)</label>
                    <textarea id="description" rows="3" placeholder="Additional keywords or description..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" class="secondary-btn" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="primary-btn">Save Source</button>
                </div>
            </form>
        </div>
    </div>

    <script src="sources.js"></script>
</body>

</html>
