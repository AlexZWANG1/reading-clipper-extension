<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阅读知识卡片仓库</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="app">
    <!-- 顶部区域 - 左标题 + 右模式切换 -->
    <header class="app-header">
      <div class="header-left">
        <h1>阅读知识卡片仓库</h1>
        <p class="subtitle">查看自动生成的阅读卡片，按 Topic 管理</p>
      </div>
      <div style="display: flex; gap: 12px; align-items: center;">
        <a href="sources.html"
          style="text-decoration: none; color: var(--color-interactive); font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 4px; padding: 6px 12px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-bg-secondary);">
          <span>⚙️</span> 管理信息源
        </a>
        <div class="view-tabs">
          <button class="view-tab active" data-view="cards">卡片模式</button>
          <button class="view-tab" data-view="documents">文档模式</button>
        </div>
      </div>
    </header>

    <!-- 卡片视图 -->
    <div id="cardsView" class="view-container">
      <!-- 添加卡片区域 -->
      <section class="add-card-section panel">
        <h3>添加新卡片</h3>
        <div class="add-card-form">
          <!-- 文件上传区域 -->
          <div class="form-group">
            <label class="form-label">上传文件生成卡片（PDF/Word/文本）</label>
            <div class="file-upload-row">
              <input type="file" id="documentFileInput" accept=".pdf,.doc,.docx,.txt,.md" style="display: none;">
              <button type="button" id="selectFileBtn" class="btn-secondary">选择文件</button>
              <span id="selectedFileName" class="file-name-display"></span>
              <button type="button" id="removeFileBtn" class="btn-small btn-danger" style="display: none;">移除</button>
            </div>
            <button type="button" id="generateFromFileBtn" class="btn-primary file-generate-btn"
              style="display: none;">从文件生成卡片</button>
          </div>

          <div class="form-divider">或</div>

          <div class="form-group">
            <textarea id="cardSnippetInput" class="card-snippet-input" placeholder="在此粘贴文字内容或图片...（支持 Ctrl+V 粘贴图片）"
              rows="4"></textarea>
          </div>

          <!-- 图片预览区域 -->
          <div id="cardImagePreview" class="image-preview-container" style="display: none;">
            <div class="image-preview-content">
              <img id="cardImagePreviewImg" class="preview-image" alt="预览图片">
              <div class="image-preview-actions">
                <button type="button" id="removeImageBtn" class="btn-small btn-danger">移除图片</button>
                <p class="image-hint">图片将随卡片一起提交</p>
              </div>
            </div>
          </div>

          <!-- 额外选项 -->
          <details class="extra-options">
            <summary>更多选项（来源、Topic）</summary>
            <div class="extra-options-grid">
              <div class="form-group">
                <label for="cardSourceName">来源名称</label>
                <input type="text" id="cardSourceName" placeholder="文章标题/网站名称">
              </div>
              <div class="form-group">
                <label for="cardSourceUrl">来源链接</label>
                <input type="text" id="cardSourceUrl" placeholder="https://...">
              </div>
              <div class="form-group">
                <label for="cardTopicSelect">归属 Topic</label>
                <select id="cardTopicSelect">
                  <option value="">选择 Topic...</option>
                </select>
              </div>
            </div>
          </details>

          <div class="form-actions">
            <button id="confirmAddCardBtn" class="btn-primary">生成并添加卡片</button>
          </div>
        </div>
      </section>

      <!-- 控制区 -->
      <section class="controls panel">
        <div class="control-group">
          <label for="topicFilter">Topic：</label>
          <select id="topicFilter">
            <option value="">全部 Topic</option>
          </select>
        </div>

        <div class="control-group">
          <label for="sourceFilter">信息源：</label>
          <select id="sourceFilter">
            <option value="">全部信息源</option>
          </select>
        </div>

        <div class="control-group">
          <label for="importanceFilter">重要度：</label>
          <select id="importanceFilter">
            <option value="">全部</option>
            <option value="1">🔴 重要</option>
            <option value="2">🟠 普通</option>
            <option value="3">⚪ 闲聊</option>
          </select>
        </div>

        <div class="control-group">
          <label for="searchInput">语义搜索：</label>
          <input type="text" id="searchInput" placeholder="输入关键词进行语义搜索...">
          <button id="searchBtn" class="btn-primary">搜索</button>
        </div>

        <button id="refreshBtn" class="btn-secondary">刷新</button>
      </section>

      <!-- 文档生成区 -->
      <section class="agent2-section panel">
        <h3>文档生成助手</h3>
        <div class="agent2-controls">
          <div class="control-group">
            <label for="docTopicInput">文档主题：</label>
            <input type="text" id="docTopicInput" placeholder="当未选择 Topic 时，将根据卡片内容自动生成" readonly>
          </div>
          <div class="agent2-buttons">
            <button id="generateFromSelectedBtn" class="btn-primary">
              基于勾选 / 当前筛选的卡片生成文档
            </button>
          </div>
        </div>
        <div class="agent2-hints">
          <p class="hint-text">
            若选择了上方 Topic，则文档主题与该 Topic 完全一致；若未选择，则系统会根据当前卡片内容自动生成文档主题。
          </p>
        </div>
      </section>

      <!-- 卡片统计 -->
      <div id="cardStats" class="card-stats">
        <span id="selectedCount">已选中 0 张卡片</span>
        <span id="cardCount"></span>
      </div>

      <!-- 列表区 -->
      <main>
        <div id="cardsContainer" class="cards-container">
          <div class="loading">加载中...</div>
        </div>
      </main>
    </div>

    <!-- 文档视图 -->
    <div id="documentsView" class="view-container" style="display: none;">
      <div class="documents-layout-3col">
        <!-- Left: Document List -->
        <aside class="doc-column">
          <div class="doc-column-header">
            <span>文档列表</span>
            <button id="refreshDocsBtn" class="btn-small" title="刷新">↻</button>
          </div>
          <div class="doc-topic-filter-wrapper">
            <select id="docTopicFilter">
              <option value="">全部 Topic</option>
            </select>
          </div>
          <div id="documentsList" class="doc-column-content">
            <div class="loading">加载中...</div>
          </div>
          <div class="doc-list-footer">
            <button id="createDocBtn" class="btn-primary" style="width: 100%;">＋ 新建文档</button>
          </div>
        </aside>

        <!-- Middle: Document Detail -->
        <main class="doc-column">
          <div class="doc-column-header">
            <span>文档详情</span>
            <div class="doc-actions">
              <span id="unsavedIndicator" class="dirty-indicator">未保存</span>
              <button id="saveDocBtn" class="btn-small primary" disabled>保存</button>
              <button id="exportMarkdownBtn" class="btn-small" disabled>导出 MD</button>
              <button id="deleteDocBtn" class="btn-small btn-danger" disabled>删除</button>
            </div>
          </div>
          <div id="documentDetail" class="doc-column-content">
            <div class="empty-state">请从左侧选择一个文档查看详情</div>
          </div>
        </main>

        <!-- Right: Card Pool -->
        <aside class="doc-column" id="cardPoolColumn">
          <div class="doc-column-header">
            <span>卡片池</span>
            <div class="pool-header-actions">
              <span id="poolCount" class="pool-count">0</span>
              <button id="togglePoolBtn" class="pool-collapse-btn" title="折叠/展开">◀</button>
            </div>
          </div>
          <div class="card-pool-controls">
            <input type="text" id="cardPoolSearch" placeholder="搜索卡片..." class="pool-search-input">
            <label class="pool-filter-label">
              <input type="checkbox" id="showUnusedOnly"> 仅看未使用
            </label>
          </div>
          <div id="cardPoolContainer" class="doc-column-content pool-content">
            <div class="empty-state">选择文档以加载卡片</div>
          </div>
        </aside>
      </div>
    </div>

    <!-- 新建文档对话框 -->
    <div id="createDocDialog" class="dialog-overlay">
      <div class="dialog-content">
        <h3>新建文档</h3>
        <div class="dialog-form">
          <div class="form-group">
            <label for="newDocTitle">文档标题：</label>
            <input type="text" id="newDocTitle" placeholder="未命名文档" value="未命名文档">
          </div>
          <div class="form-group">
            <label for="newDocTopic">归属 Topic：</label>
            <select id="newDocTopic">
              <option value="">选择 Topic...</option>
            </select>
          </div>
          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" id="preloadCards" checked> 预加载该 Topic 所有卡片到卡片池
            </label>
          </div>
        </div>
        <div class="dialog-buttons">
          <button id="cancelCreateDocBtn" class="btn-secondary">取消</button>
          <button id="confirmCreateDocBtn" class="btn-primary">创建</button>
        </div>
      </div>
    </div>

    <!-- AI 建议弹窗 -->
    <div id="aiSuggestionDialog" class="dialog-overlay">
      <div class="dialog-content ai-suggestion-dialog">
        <h3 id="aiSuggestionTitle">AI 建议</h3>
        <div id="aiSuggestionLoading" class="loading" style="display: none;">AI 正在思考...</div>
        <div id="aiSuggestionList" class="suggestion-list"></div>
        <div id="aiSuggestionContent"></div>
        <div class="dialog-buttons">
          <button id="closeAiSuggestionBtn" class="btn-secondary">关闭</button>
        </div>
      </div>
    </div>

    <!-- 卡片详情浮层 -->
    <div id="cardDetailPopup" class="card-detail-popup">
      <div class="card-detail-header">
        <span>卡片详情</span>
        <button id="closeCardDetailBtn" class="popup-close">×</button>
      </div>
      <div id="cardDetailContent" class="card-detail-content"></div>
    </div>

    <!-- Markdown Export Overlay -->
    <div id="markdownOverlay" class="markdown-overlay"></div>
    <div id="markdownOutputContainer" class="markdown-output-container">
      <h3>Markdown 导出</h3>
      <textarea id="docMarkdownOutput" class="markdown-textarea" readonly></textarea>
      <div class="markdown-actions">
        <button id="copyMarkdownBtn" class="btn-secondary">复制到剪贴板</button>
        <button id="downloadMarkdownBtn" class="btn-secondary">下载 .md 文件</button>
        <button id="closeMarkdownBtn" class="btn-primary">关闭</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
