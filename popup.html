<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading Clipper 模式</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      margin: 0;
    }
    h2 {
      margin: 0 0 16px 0;
      font-size: 16px;
      font-weight: 600;
    }
    .mode-group {
      margin-bottom: 16px;
    }
    .mode-option {
      margin-bottom: 12px;
    }
    .mode-option label {
      display: flex;
      align-items: flex-start;
      cursor: pointer;
    }
    .mode-option input[type="radio"] {
      margin-right: 8px;
      margin-top: 2px;
    }
    .mode-description {
      font-size: 12px;
      color: #666;
      margin-left: 24px;
      margin-top: 4px;
    }
    #focusSection {
      margin-left: 24px;
      margin-top: 12px;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 4px;
    }
    #focusSection label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }
    #topicSelect {
      width: 100%;
      padding: 6px 8px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
    #newTopicInput {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .button-group {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    button {
      flex: 1;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    #saveBtn {
      background: #007bff;
      color: white;
    }
    #saveBtn:hover {
      background: #0056b3;
    }
    #resetBtn {
      background: #6c757d;
      color: white;
    }
    #resetBtn:hover {
      background: #5a6268;
    }
  </style>
</head>
<body>
  <h2>Reading Clipper 模式</h2>
  
  <div class="mode-group">
    <div class="mode-option">
      <label>
        <input type="radio" name="mode" value="free" checked>
        <div>
          <div>随心所欲模式</div>
          <div class="mode-description">卡片都暂时归入"未归类"</div>
        </div>
      </label>
    </div>
    
    <div class="mode-option">
      <label>
        <input type="radio" name="mode" value="focus">
        <div>
          <div>Focus 研究模式</div>
        </div>
      </label>
    </div>
    
    <div id="focusSection" style="display: none;">
      <label for="topicSelect">选择已有 Topic</label>
      <select id="topicSelect">
        <option value="">（从已有 Topic 里选择）</option>
      </select>
      
      <input type="text" id="newTopicInput" placeholder="或者在这里输入新的 Topic 名称">
    </div>
  </div>
  
  <div class="button-group">
    <button id="saveBtn">保存模式设置</button>
    <button id="resetBtn">清空模式（回到随心所欲）</button>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
